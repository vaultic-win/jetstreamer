[package]
name = "horizon-current-reader-tests"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "../../jetstreamer-r2/src/current_reader.rs"

[[bin]]
name = "progressive-tests"
path = "../../jetstreamer-r2-progressive/src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
tempfile = "3"
