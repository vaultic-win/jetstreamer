[package]
name = "horizon251-launch5"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "horizon251-standalone-guard"
path = "../../jetstreamer-utils/src/horizon_standalone_guard_bin.rs"

[[bin]]
name = "horizon251-sealer"
path = "../../jetstreamer-utils/src/seal_deployment_bin.rs"

[features]
epoch207-native-main-guard = []
epoch209-native-main-guard = []
epoch209-singleton-guard = []
epoch210-native-main-guard = []
epoch211-native-main-guard = []
epoch211-singleton-guard = []
epoch223-native20-prefix-guard = []
epoch227-native-main-guard = []
epoch227-singleton-guard = []
epoch227-v1625-native-main-guard = []
epoch228-native-main-guard = []
epoch239-native-import-guard = []
epoch244-native-import-guard = []
epoch251-native-main-guard = []

[workspace]
[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
