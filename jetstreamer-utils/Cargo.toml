[package]
name = "jetstreamer-utils"
description = "Support crate for Jetstreamer containing utility functions, types, and ClickHouse integration"
keywords.workspace = true
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
sst-capability-tests = ["dep:rocksdb"]
# Pins the separate bounded epoch225 upstream-comparison worker, not an era.
epoch225-v1-6-25-diagnostic = []
# Separate capped-shrink epoch225 prefix measurement; no route promotion.
epoch225-shrink-budget-resource = []
# Private same-input epoch203 resource comparison; no runtime promotion.
epoch203-single-thread-resource = []
# Exact private comparison of the v1.6.16 upstream shrink-budget cap.
epoch203-shrink-budget-resource = []
# Private, resource-limited canonical-root prefix qualification, not publication.
epoch203-root-prefix-resource = []
# Same canonical root and safety envelope, separately pinned capped-shrink worker.
epoch203-shrink-root-prefix-resource = ["epoch203-root-prefix-resource"]
# Closed private cold epoch223 prefix ending at the independently known root.
epoch223-root-prefix-resource = []
# Private fixed-span epoch224 measurement against its pinned v1.6.25 package.
epoch224-bounded-resource = []
# Dormant exact epoch205 checkpoint-prefix measurement; no ordinary replay.
epoch205-bounded-resource = []

[lib]
name = "jetstreamer_utils"

[[bin]]
name = "clickhouse-server"
path = "src/clickhouse_server_bin.rs"

[[bin]]
name = "clickhouse-client"
path = "src/clickhouse_client_bin.rs"

[[bin]]
name = "jetstreamer-blockzilla-poh-extract"
path = "src/blockzilla_poh_extract_bin.rs"

[[bin]]
name = "jetstreamer-blockzilla-boundary-collect"
path = "src/blockzilla_boundary_collect_bin.rs"

