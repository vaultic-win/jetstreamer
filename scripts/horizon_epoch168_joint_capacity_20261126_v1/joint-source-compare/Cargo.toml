[package]
name = "horizon-epoch168-joint-compare"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "horizon-epoch168-joint-compare"
path = "prefix_index.rs"

[[bin]]
name = "horizon-168-joint-lineage"
path = "joint_lineage.rs"

[dependencies]
jetstreamer-horizon = { path = "../../../jetstreamer-horizon" }
libc = "0.2"
lencode = "2.0.0"
serde_json = "1"
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

zstd = "0.13"
bs58 = "0.5"
tempfile = "3"
