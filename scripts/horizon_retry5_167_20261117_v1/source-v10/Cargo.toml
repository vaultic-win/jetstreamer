[package]
name = "horizon-epoch167-retry6-live166retry7-prepare"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
preparation = []

[[bin]]
name = "prepare"
path = "main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
crc = "3"
libc = "0.2"
md5 = { package = "md-5", version = "0.10" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
