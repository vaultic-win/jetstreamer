[package]
name = "horizon-r2-chronological-plugin-audit"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.102"
aws-credential-types = "=1.2.14"
aws-sdk-s3 = { version = "=1.119.0", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
aws-types = "=1.3.16"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "time"] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.dev]
debug = 0

[profile.release]
debug = 0
strip = "debuginfo"
