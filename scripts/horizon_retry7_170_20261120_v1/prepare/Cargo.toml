[package]
name = "horizon-epoch170-retry7-prepare"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
preparation = []
epoch228-native-main-guard = []
epoch227-v1625-native-main-guard = []
epoch227-singleton-guard = []
epoch227-native-main-guard = []
epoch223-native20-prefix-guard = []
epoch210-native-main-guard = []
epoch209-singleton-guard = []
epoch209-native-main-guard = []
epoch207-native-main-guard = []

[[bin]]
name = "prepare"
path = "main.rs"
required-features = ["preparation"]

[dependencies]
anyhow = "1"
base64 = "0.22"
crc = "3"
libc = "0.2"
md5 = { package = "md-5", version = "0.10" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
