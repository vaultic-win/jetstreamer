[package]
name = "horizon-epoch136-native-preinit"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[[bin]]
name = "epoch136-native-preinit-probe"
path = "probe.rs"

[[bin]]
name = "epoch136-native-preinit-guard"
path = "guard.rs"
