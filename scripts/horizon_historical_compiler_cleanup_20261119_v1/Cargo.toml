[package]
name = "horizon-historical-compiler-cleanup"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 1
codegen-units = 256
debug = false
incremental = false
