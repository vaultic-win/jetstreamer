[workspace]
members = ["capture", "extractor"]
default-members = ["capture"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Exact direct versions from the parent account-updates Cargo.lock.
[workspace.dependencies]
libc = "=0.2.189"
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }
sha2 = "=0.10.9"

# Path dependencies do not inherit their original workspace's patch table.
# Retain the current account-updates runtime source selections explicitly.
[patch.crates-io]
solana-program-runtime = { path = "../../vendor/solana-program-runtime" }
solana-svm = { path = "../../vendor/solana-svm" }
solana-runtime = { path = "../../vendor/solana-runtime-3.1.12" }

# Small serial qualification builds; no production artifact is accepted here.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
debug = 0
incremental = false
lto = false
codegen-units = 16
