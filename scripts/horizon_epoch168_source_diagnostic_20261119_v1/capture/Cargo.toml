[package]
name = "horizon-epoch168-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[features]
native-transport-tests = []

[[bin]]
name = "capture168"
path = "src/main.rs"

[dependencies]
libc.workspace = true
# Disable the default proxy/HTTP2/charset feature bundle. The reviewed source
# also explicitly disables retries, redirects, proxies and decompression.
# chunk() is available without the stream feature; rustls enables HTTPS.
reqwest = { version = "=0.13.3", default-features = false, features = ["rustls"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "=1.52.3", default-features = false, features = ["rt", "net", "time"] }

[dev-dependencies]
rustls = { version = "=0.23.40", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
