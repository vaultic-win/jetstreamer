[package]
name = "horizon-epoch168-source-extractor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[features]
default = ["epoch168-source-diagnostic"]
epoch168-source-diagnostic = [
    "jetstreamer-firehose/verify-transaction-signatures",
    "solana-transaction/verify",
]

[[bin]]
name = "epoch168-source-extract"
path = "src/main.rs"
required-features = ["epoch168-source-diagnostic"]

[dependencies]
bincode = "=1.3.3"
cid = "=0.11.3"
jetstreamer-firehose = { path = "../../../jetstreamer-firehose", default-features = false }
libc.workspace = true
prost_011 = { package = "prost", version = "=0.11.9" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_cbor = "=0.11.2"
serde_json.workspace = true
sha2.workspace = true
solana-account-decoder-client-types = "=3.1.12"
solana-instruction-error = "=2.3.0"
solana-message = "=3.0.1"
solana-serde = "=3.0.0"
solana-signature = { version = "=3.1.0", default-features = false }
solana-storage-proto = "=3.1.12"
solana-transaction = "=3.0.2"
solana-transaction-error = "=3.2.0"
solana-transaction-status = "=3.1.12"
zstd = { version = "=0.13.3", default-features = false }

[dev-dependencies]
base64 = "=0.23.1"
multihash = { version = "=0.19.5", default-features = false }
tempfile = "=3.27.0"
