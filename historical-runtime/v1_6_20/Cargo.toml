[workspace]
members = [
    "protocol",
    "worker",
]
exclude = [
    "vendor/solana-program-1.6.20",
    "vendor/solana-bpf-loader-program-1.6.20",
    "vendor/solana-runtime-1.6.20",
]

# Exact original program SDK, with a default-off, private epoch 223 candidate.
# Patch the Git source for all transitive users so runtime and SDK agree.
[patch."https://github.com/solana-labs/solana.git"]
solana-program = { path = "vendor/solana-program-1.6.20" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
