[package]
name = "jetstreamer-historical-worker-v1-6-25"
version = "0.1.0"
edition = "2018"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

[features]
# Test-only escape hatch used to exercise sha2 0.9.9's portable backend on
# SHA-NI hosts. Production builds leave this disabled and runtime-dispatch.
poh-force-soft = ["sha2-fast/force-soft"]
# Dedicated diagnostic build used to compare true singleton execution with
# the ordinary conflict-wave path. The worker still requires historical trace
# output at runtime and remains an explicitly unqualified candidate.
diagnostic-singleton = []
# Private epoch 223 candidate: two exact bootstraps, never beyond that epoch.
epoch223-v1-6-25-qualification = []
# Isolated fee/load reproduction: exact cold bootstrap and first 16warmup slots.
# Keeps native execution semantics; cannot reach epoch 223 recording or its tail.
epoch223-fee-load-warmup-diagnostic = ["epoch223-v1-6-25-qualification"]
# Build-bound epoch-224 v1.6.25 comparison. It keeps ordinary conflict-wave
# execution but refuses input after the first previously observed downstream
# mismatch, so the candidate cannot become an unbounded replay accidentally.
epoch224-v1-6-25-diagnostic = []
# Private epoch-224 complete-span checkpoint qualification. This is not an era promotion.
epoch224-v1-6-25-qualification = []
# Private bounded epoch-225 comparison; no default era or publication change.
epoch225-v1-6-25-diagnostic = []
epoch225-v1-6-25-qualification = []
# Isolated epoch 227 native/bounded comparison through the first failed vote.
epoch227-v1-6-25-diagnostic = []
# Exact epoch 227 checkpoint qualification; no era or publication promotion.
epoch227-v1-6-25-qualification = []

[dependencies]
bincode = "=1.3.1"
bzip2 = "=0.3.3"
cfg-if = "=1.0.0"
cpufeatures = "=0.2.1"
jetstreamer-historical-protocol = { path = "../protocol" }
# Preserve the newest libc known to compile under this historical toolchain;
# sha2-fast's CPU dispatcher otherwise lets a fresh resolver select a crate
# whose manifest requires the Rust 2021 edition.
libc = "=0.2.155"
num_cpus = "=1.13.0"
num-derive = "=0.3.2"
proc-macro2 = "=1.0.24"
quote = "=1.0.6"
rand = "=0.7.3"
rand_chacha = "=0.2.2"
rayon = "=1.5.0"
serde = "=1.0.125"
sha2 = "=0.8.2"
sha2-fast = { package = "sha2", version = "=0.9.9", features = ["compress"] }
syn = "=1.0.67"
thiserror = "=1.0.21"
solana-runtime = { path = "../vendor/solana-runtime-1.6.25", version = "=1.6.25" }
solana-bpf-loader-program = { path = "../vendor/solana-bpf-loader-program-1.6.25", version = "=1.6.25" }
solana-config-program = { git = "https://github.com/solana-labs/solana.git", rev = "7de8a55b54d3e11058b82f9483bb405d143b455c", version = "=1.6.25" }
solana-merkle-tree = { git = "https://github.com/solana-labs/solana.git", rev = "7de8a55b54d3e11058b82f9483bb405d143b455c", version = "=1.6.25" }
solana-rayon-threadlimit = { git = "https://github.com/solana-labs/solana.git", rev = "7de8a55b54d3e11058b82f9483bb405d143b455c", version = "=1.6.25" }
solana-sdk = { git = "https://github.com/solana-labs/solana.git", rev = "7de8a55b54d3e11058b82f9483bb405d143b455c", version = "=1.6.25" }
solana-stake-program = { git = "https://github.com/solana-labs/solana.git", rev = "7de8a55b54d3e11058b82f9483bb405d143b455c", version = "=1.6.25" }
solana-vote-program = { git = "https://github.com/solana-labs/solana.git", rev = "7de8a55b54d3e11058b82f9483bb405d143b455c", version = "=1.6.25" }
tar = "=0.4.28"
tempfile = "=3.1.0"
zstd = "=0.5.3"

[dev-dependencies]
bs58 = "=0.3.1"
