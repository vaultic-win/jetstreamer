name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag, or branch to release (must have passing Rust and Nix CI)"
        required: true
        default: main
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      # Keep automation from this workflow revision, even when releasing an older tag.
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test release tooling
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_github.py'
      - name: Verify source, CI, and existing release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.ref }}
        run: python3 .github/scripts/release-github.py plan --ref "$RELEASE_REF"

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish GitHub source release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.check.outputs.sha }}
        run: python3 .github/scripts/release-github.py publish --ref "$RELEASE_SHA"
