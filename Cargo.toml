[workspace]
members = ["jetstreamer-firehose", "jetstreamer-plugin", "jetstreamer-utils"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.10.0"
authors = ["sam0x17", "anza-team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/vaultic-win/jetstreamer"
documentation = "https://docs.rs/jetstreamer/latest"
keywords = ["solana", "geyser", "jetstreamer", "firehose", "transaction"]

[package]
name = "jetstreamer"
description = "High-throughput Solana transaction ledger streaming and plugin framework suitable for research and backfilling"
keywords.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []
geyser = ["jetstreamer-firehose/geyser"]
s3-backend = ["jetstreamer-firehose/s3-backend"]
verify-transaction-signatures = ["jetstreamer-firehose/verify-transaction-signatures"]

[workspace.dependencies]
jetstreamer-firehose = { path = "jetstreamer-firehose", version = "0.10.0" }
jetstreamer-plugin = { path = "jetstreamer-plugin", version = "0.10.0" }
jetstreamer-utils = { path = "jetstreamer-utils", version = "0.10.0" }
tokio = "1"
futures-util = { version = "0", default-features = false }
log = "0"
once_cell = "1"
serde_json = { version = "1", default-features = false }
thiserror = { version = "2", default-features = false }
reqwest = { version = "0.13", default-features = false }
base64 = "0.23"
bincode = "1"
serial_test = "4"
wincode = "0.6"
cid = "0"
crc = "3"
crossbeam-channel = { version = "0", default-features = false }
fnv = { version = "1", default-features = false }
url = { version = "2", default-features = false }
multihash = { version = "0", default-features = false }
prost = "0.14"
serde = { version = "1", default-features = false }
serde_cbor = "0"
solana-address = "2"
solana-hash = "4"
solana-blake3-hasher = "3"
solana-epoch-rewards-hasher = "3"
solana-keccak-hasher = "3"
solana-logger = "3"
solana-signature = { version = "3", default-features = false }
# Keep Agave's internal APIs on one tested release.
solana-accounts-db = { version = "=4.4.0", features = ["agave-unstable-api"] }
solana-entry = { version = "=4.4.0", features = ["agave-unstable-api"] }
solana-ledger = { version = "=4.4.0", features = ["agave-unstable-api"] }
solana-geyser-plugin-manager = { version = "=4.4.0", features = ["agave-unstable-api"] }
solana-rpc = { version = "=4.4.0", features = ["agave-unstable-api"] }
solana-runtime = { version = "=4.4.0", features = ["agave-unstable-api"] }
solana-storage-proto = { version = "=4.4.0", features = ["agave-unstable-api"] }
solana-message = { version = "5", features = ["wincode"] }
solana-transaction = { version = "5", features = ["wincode"] }
solana-transaction-status = { version = "=4.4.0", features = ["agave-unstable-api"] }
solana-sdk-ids = "3"
solana-reward-info = "7"
solana-sysvar = "5"
sha2 = "0.11"
zstd = { version = "0", default-features = false }
rseek = "0.4.1"
ripget = "0.3"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
ahash = "0.8"
dashmap = "6"
clickhouse = { version = "0.15", default-features = false }
ctrlc = "3"
tempfile = "3"
libc = "0"
aws-credential-types = "1"
aws-sdk-s3 = "1"
aws-smithy-types = "1"
aws-types = "1"

[dependencies]
tokio.workspace = true
solana-logger.workspace = true
log.workspace = true
jetstreamer-firehose.workspace = true
jetstreamer-plugin.workspace = true
jetstreamer-utils.workspace = true
url.workspace = true
ratatui = "0.30"
crossterm = "0.29"
libc = "0.2"
sysinfo = "0.40"
solana-sysvar.workspace = true
solana-blake3-hasher.workspace = true
solana-epoch-rewards-hasher.workspace = true
solana-keccak-hasher.workspace = true

[dev-dependencies]
clickhouse.workspace = true

# Live replay tests verify hundreds of thousands of signatures with all features.
# Optimize the crypto dependency while retaining test-time correctness checks.
[profile.test.package.solana-ed25519]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.release.package."*"]
opt-level = 3
codegen-units = 1

# Only the optional `geyser` loader needs Agave's patched ledger/RocksDB stack.
# Cargo does not propagate these patches to consumers; see the firehose README
# before enabling `geyser` outside this workspace.
[patch.crates-io]
librocksdb-sys = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
rocksdb = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
