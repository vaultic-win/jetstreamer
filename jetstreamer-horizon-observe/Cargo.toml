[package]
name = "jetstreamer-horizon-observe"
description = "Read-only invocation-bound Horizon replay resource sampler"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true

[features]
# Diagnostic CPU allocation released by the exact reserve-stopped epoch225.
# Cannot run while that producer or another fleet claim is live.
ram-snapshot-eight-core-stopped225 = []
# Isolated selected-profile v1.6.25 snapshot tests; no entry replay or publication.
epoch225-shrink-snapshot-tests = []
# Dormant private same-input RAM comparison; no ordinary replay or publication.
epoch203-ram-resource-supervisor = []
epoch203-ram-shrink-candidate = ["epoch203-ram-resource-supervisor"]

[[bin]]
name = "jetstreamer-horizon-status-estimate"
path = "src/status_estimate.rs"

[[bin]]
name = "jetstreamer-epoch223-bootstrap-estimate"
path = "src/epoch223_bootstrap_estimate.rs"

[[bin]]
name = "jetstreamer-horizon-verify-pair"
path = "src/verify_pair.rs"

[[bin]]
name = "jetstreamer-horizon-routine-cycle"
path = "src/routine_cycle.rs"

[[bin]]
name = "jetstreamer-epoch157-incident"
path = "src/incident157.rs"

[[bin]]
name = "jetstreamer-epoch220-prefix-evidence"
path = "src/incident220.rs"

[[bin]]
name = "jetstreamer-horizon-ram-snapshot-test"
path = "src/ram_snapshot_test.rs"

[[bin]]
name = "jetstreamer-epoch203-ram-resource-plan"
path = "src/epoch203_ram_resource_plan.rs"

[[bin]]
name = "jetstreamer-epoch203-ram-storage-probe"
path = "src/epoch203_ram_storage_probe.rs"

[[bin]]
name = "jetstreamer-epoch203-ram-retain"
path = "src/ram_artifact_retain.rs"

[[bin]]
name = "jetstreamer-epoch203-ram-retire-scratch"
path = "src/ram_scratch_retire_bin.rs"

[[bin]]
name = "jetstreamer-epoch203-ram-lifecycle-qualify"
path = "src/ram_lifecycle_qualify_bin.rs"

[[bin]]
name = "jetstreamer-epoch203-ram-launch-attest"
path = "src/ram_launch_attest_bin.rs"

[[bin]]
name = "jetstreamer-horizon-dev-cache-check"
path = "src/dev_cache_check_bin.rs"

[[bin]]
name = "jetstreamer-epoch203-stopped-scratch-check"
path = "src/stopped203_check_bin.rs"

[[bin]]
name = "jetstreamer-epoch203-stopped-scratch-retire"
path = "src/stopped203_retire_bin.rs"

[[bin]]
name = "jetstreamer-epoch203-ram-resource"
path = "src/epoch203_ram_resource.rs"
required-features = ["epoch203-ram-resource-supervisor"]

[dependencies]
anyhow.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sha2.workspace = true
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
