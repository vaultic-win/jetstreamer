[package]
name = "jetstreamer-horizon-observe"
description = "Read-only invocation-bound Horizon replay resource sampler"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true

[features]
# Diagnostic CPU allocation released by the exact reserve-stopped epoch225.
# Cannot run while that producer or another fleet claim is live.
ram-snapshot-eight-core-stopped225 = []
# Isolated selected-profile v1.6.25 snapshot tests; no entry replay or publication.
epoch225-shrink-snapshot-tests = []
# Exact private epoch223 tail snapshot tests; separate inputs and fleet contract.
epoch223-tail-snapshot-tests = []
# Separate exact cold snapshot; cannot borrow the tail's input/anchor contract.
epoch223-cold-snapshot-tests = []
# Exact cold input qualification of the entry-bounded fee/load candidate.
epoch223-warmup-snapshot-tests = ["epoch223-cold-snapshot-tests"]
epoch223-v1620-native-input = ["epoch223-cold-snapshot-tests"]
epoch223-v1620-native-input-release = ["epoch223-v1620-native-input"]
# Dormant private same-input RAM comparison; no ordinary replay or publication.
epoch203-ram-resource-supervisor = []
epoch203-ram-shrink-candidate = ["epoch203-ram-resource-supervisor"]

[[bin]]
name = "jetstreamer-prefix203-completion-dispatch"
path = "src/prefix203_completion_dispatch.rs"

[[bin]]
name = "jetstreamer-horizon-status-estimate"
path = "src/status_estimate.rs"

[[bin]]
name = "jetstreamer-bootstrap227-cache-retire"
path = "src/bootstrap227_cache_retire_bin.rs"

[[bin]]
name = "jetstreamer-terminal205-cache-retire"
path = "src/terminal205_cache_retire_bin.rs"

[[bin]]
name = "jetstreamer-epoch223-tail-exact-evidence"
